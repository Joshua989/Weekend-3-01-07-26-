<text x="200" y="88" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif"><tspan x="200" y="88">PEOPLE</tspan></text>
<line x1="174" y1="161" x2="231" y2="161" stroke="#5c6b64" stroke-width="1" marker-end="url(#arrow)"/>
