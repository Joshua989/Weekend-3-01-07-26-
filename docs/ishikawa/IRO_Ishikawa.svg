<text x="569" y="599" font-size="11.5" font-weight="normal" text-anchor="end" dominant-baseline="middle" fill="#1d2a24" font-family="Arial, Helvetica, sans-serif"><tspan x="569" y="599">Poor dialogue between stakeholders</tspan></text>
<line x1="614" y1="539" x2="671" y2="539" stroke="#5c6b64" stroke-width="1" marker-end="url(#arrow)"/>
<text x="609" y="539" font-size="11.5" font-weight="normal" text-anchor="end" dominant-baseline="middle" fill="#1d2a24" font-family="Arial, Helvetica, sans-serif"><tspan x="609" y="539">Bodies don't share information</tspan></text>
<line x1="654" y1="479" x2="711" y2="479" stroke="#5c6b64" stroke-width="1" marker-end="url(#arrow)"/>
<text x="649" y="479" font-size="11.5" font-weight="normal" text-anchor="end" dominant-baseline="middle" fill="#1d2a24" font-family="Arial, Helvetica, sans-serif"><tspan x="649" y="479">Victims don't know who to contact</tspan></text>
