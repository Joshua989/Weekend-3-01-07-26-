<text x="969" y="281" font-size="11.5" font-weight="normal" text-anchor="end" dominant-baseline="middle" fill="#1d2a24" font-family="Arial, Helvetica, sans-serif"><tspan x="969" y="281">Weak enforcement of resolutions</tspan></text>
