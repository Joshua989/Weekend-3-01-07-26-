<text x="209" y="599" font-size="11.5" font-weight="normal" text-anchor="end" dominant-baseline="middle" fill="#1d2a24" font-family="Arial, Helvetica, sans-serif"><tspan x="209" y="599">Paper / verbal records get lost</tspan></text>
<line x1="254" y1="539" x2="311" y2="539" stroke="#5c6b64" stroke-width="1" marker-end="url(#arrow)"/>
<text x="249" y="539" font-size="11.5" font-weight="normal" text-anchor="end" dominant-baseline="middle" fill="#1d2a24" font-family="Arial, Helvetica, sans-serif"><tspan x="249" y="539">No data for trend analysis</tspan></text>
<line x1="294" y1="479" x2="351" y2="479" stroke="#5c6b64" stroke-width="1" marker-end="url(#arrow)"/>
<text x="289" y="479" font-size="11.5" font-weight="normal" text-anchor="end" dominant-baseline="middle" fill="#1d2a24" font-family="Arial, Helvetica, sans-serif"><tspan x="289" y="479">No status alerts (SMS / email)</tspan></text>
<line x1="560" y1="710" x2="760" y2="410" stroke="#0b6e4f" stroke-width="2.5"/>
<rect x="465" y="714" width="190" height="36" rx="6" fill="#0b6e4f"/>
<text x="560" y="732" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif"><tspan x="560" y="732">COMMUNICATION</tspan></text>
