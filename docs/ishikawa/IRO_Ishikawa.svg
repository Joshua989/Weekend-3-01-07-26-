<text x="209" y="221" font-size="11.5" font-weight="normal" text-anchor="end" dominant-baseline="middle" fill="#1d2a24" font-family="Arial, Helvetica, sans-serif"><tspan x="209" y="221">Mutual distrust (town vs gown)</tspan></text>
