<rect x="465" y="70" width="190" height="36" rx="6" fill="#0b6e4f"/>
<text x="560" y="88" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif"><tspan x="560" y="88">PROCESS / METHODS</tspan></text>
