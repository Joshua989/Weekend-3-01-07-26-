<text x="889" y="161" font-size="11.5" font-weight="normal" text-anchor="end" dominant-baseline="middle" fill="#1d2a24" font-family="Arial, Helvetica, sans-serif"><tspan x="889" y="161">Unclear responsibility (Univ. vs community)</tspan></text>
<line x1="934" y1="221" x2="991" y2="221" stroke="#5c6b64" stroke-width="1" marker-end="url(#arrow)"/>
<text x="929" y="221" font-size="11.5" font-weight="normal" text-anchor="end" dominant-baseline="middle" fill="#1d2a24" font-family="Arial, Helvetica, sans-serif"><tspan x="929" y="221">No anonymity / confidentiality policy</tspan></text>
