<text x="609" y="281" font-size="11.5" font-weight="normal" text-anchor="end" dominant-baseline="middle" fill="#1d2a24" font-family="Arial, Helvetica, sans-serif"><tspan x="609" y="281">No tracking or feedback to reporter</tspan></text>
