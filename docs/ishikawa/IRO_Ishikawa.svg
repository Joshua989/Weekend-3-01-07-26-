<line x1="934" y1="599" x2="991" y2="599" stroke="#5c6b64" stroke-width="1" marker-end="url(#arrow)"/>
<text x="929" y="599" font-size="11.5" font-weight="normal" text-anchor="end" dominant-baseline="middle" fill="#1d2a24" font-family="Arial, Helvetica, sans-serif"><tspan x="929" y="599">Poor street lighting &amp; security</tspan></text>
<line x1="974" y1="539" x2="1031" y2="539" stroke="#5c6b64" stroke-width="1" marker-end="url(#arrow)"/>
<text x="969" y="539" font-size="11.5" font-weight="normal" text-anchor="end" dominant-baseline="middle" fill="#1d2a24" font-family="Arial, Helvetica, sans-serif"><tspan x="969" y="539">Festival curfews (e.g. Oro) limit movement</tspan></text>
