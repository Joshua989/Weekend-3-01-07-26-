<text x="289" y="341" font-size="11.5" font-weight="normal" text-anchor="end" dominant-baseline="middle" fill="#1d2a24" font-family="Arial, Helvetica, sans-serif"><tspan x="289" y="341">Language &amp; cultural barriers</tspan></text>
