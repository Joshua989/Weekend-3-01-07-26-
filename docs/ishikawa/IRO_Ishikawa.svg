<rect width="100%" height="100%" fill="#ffffff"/>
<text x="650" y="26" font-size="20" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1d2a24" font-family="Arial, Helvetica, sans-serif"><tspan x="650" y="26">IRO – Ishikawa (Fishbone) Problem Analysis</tspan></text>
